# Install one prebuilt release into /opt/dotfiles/<name>/<version> and link its
# executables into /usr/local/bin. Expects `tool` (see packages/ubuntu.yml).
# Every download is verified against the pinned `sha256` before use.
- name: "Describe the executables | {{ tool.name }}"
  ansible.builtin.set_fact:
    packages_release_dir: "{{ packages_install_root }}/{{ tool.name }}/{{ tool.version }}"
    packages_release_archive: "{{ packages_download_dir }}/{{ tool.url | basename }}"
    # Entries are a path string or {path, as}; normalise to mappings.
    packages_release_bins: >-
      {% set bins = [] %}{% for b in tool.binaries %}{% set _ = bins.append(b if b is mapping else {'path': b}) %}{% endfor %}{{ bins }}

- name: "Create the install directory | {{ tool.name }}"
  become: true
  ansible.builtin.file:
    path: "{{ packages_release_dir }}"
    state: directory
    mode: "0755"

# Raw binaries land in place, so their checksum is re-verified on every run.
- name: "Download | {{ tool.name }}"
  become: true
  ansible.builtin.get_url:
    url: "{{ tool.url }}"
    dest: "{{ packages_release_dir }}/{{ packages_release_bins[0].path }}"
    checksum: "sha256:{{ tool.sha256 }}"
    mode: "0755"
  when: tool.format == 'raw'

- name: "Check whether this version is unpacked | {{ tool.name }}"
  ansible.builtin.stat:
    path: "{{ packages_release_dir }}/{{ packages_release_bins[0].path }}"
  register: packages_release_unpacked
  when: tool.format != 'raw'

- name: "Download and unpack | {{ tool.name }}"
  become: true
  when: tool.format != 'raw' and not packages_release_unpacked.stat.exists
  block:
    - name: "Download the verified archive | {{ tool.name }}"
      ansible.builtin.get_url:
        url: "{{ tool.url }}"
        dest: "{{ packages_release_archive }}"
        checksum: "sha256:{{ tool.sha256 }}"
        mode: "0644"

    - name: "Unpack | {{ tool.name }}"
      ansible.builtin.unarchive:
        src: "{{ packages_release_archive }}"
        remote_src: true
        dest: "{{ packages_release_dir }}"
  always:
    - name: "Remove the downloaded archive | {{ tool.name }}"
      ansible.builtin.file:
        path: "{{ packages_release_archive }}"
        state: absent

- name: "Link executables into /usr/local/bin | {{ tool.name }}"
  become: true
  ansible.builtin.file:
    src: "{{ packages_release_dir }}/{{ item.path }}"
    dest: "/usr/local/bin/{{ item.as | default(item.path | basename) }}"
    state: link
    force: true
  loop: "{{ packages_release_bins }}"
  loop_control:
    label: "{{ item.as | default(item.path | basename) }}"
