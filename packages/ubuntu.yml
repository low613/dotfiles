  # Applications
  - dolphin
  - evince
  - flatpak
  - freerdp3-x11
  - gnome-boxes
  - gnome-disk-utility
  - kwalletmanager
  - libreoffice
  - mpv
  - obs-studio
  - remmina
  - ufw
  - wireshark

# Ubuntu renames some binaries; link the names the configs and habits expect.
ubuntu_command_aliases:
  - name: bat
    target: /usr/bin/batcat
  # The niri config launches Helium by its Arch name.
  - name: helium-browser
    target: /usr/bin/helium

# Rust projects without Ubuntu packages or prebuilt binaries, built with cargo.
ubuntu_source_builds:
  - name: niri
    repo: https://github.com/YaLTeR/niri.git
    version: v26.04
    binaries: [niri]
    build_deps:
      - libdbus-1-dev
      - libdisplay-info-dev
      - libegl1-mesa-dev
      - libgbm-dev
      - libinput-dev
      - libpango1.0-dev
      - libpipewire-0.3-dev
      - libseat-dev
      - libsystemd-dev
      - libudev-dev
      - libwayland-dev
      - libxkbcommon-dev
    files:
      - { src: resources/niri-session, dest: /usr/local/bin/niri-session, mode: "0755" }
      - { src: resources/niri.service, dest: /usr/local/lib/systemd/user/niri.service }
      - { src: resources/niri-shutdown.target, dest: /usr/local/lib/systemd/user/niri-shutdown.target }
      - { src: resources/niri.desktop, dest: /usr/share/wayland-sessions/niri.desktop }
      - { src: resources/niri-portals.conf, dest: /usr/share/xdg-desktop-portal/niri-portals.conf }
  - name: wiremix
    repo: https://github.com/tsowell/wiremix.git
    version: v0.11.0
    binaries: [wiremix]
    build_deps: [libclang-dev, libpipewire-0.3-dev]
  - name: wl-clip-persist
    repo: https://github.com/Linus789/wl-clip-persist.git
    version: v0.5.0
    binaries: [wl-clip-persist]
    build_deps: []
  - name: xwayland-satellite
    repo: https://github.com/Supreeeme/xwayland-satellite.git
    version: v0.8.3
    binaries: [xwayland-satellite]
    build_deps: [libclang-dev, libxcb1-dev, libxcb-cursor-dev, libxcb-cursor0]

ubuntu_fonts:
  - name: CaskaydiaMono-NerdFont
    version: v3.5.1
    url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/CascadiaMono.tar.xz
    sha256: e4fe0248bbe2558e907d26b55ed287403972f946239a4ea3f7a8afd3365ad6ba

ubuntu_gtk_themes:
  - name: adw-gtk3
    version: "6.5"
    url: https://github.com/lassekongo83/adw-gtk3/releases/download/v6.5/adw-gtk3v6.5.tar.xz
    sha256: a81780fadfc432be0fc3d89c4ebb41aa28e4f032d42c36f9789c57dd10cfa41c

# Vendor apt repositories (deb822). `packages` are installed from each repo.
ubuntu_apt_repositories:
  - name: beekeeper-studio
    key_url: https://deb.beekeeperstudio.io/beekeeper.key
    uris: https://deb.beekeeperstudio.io
    suites: stable
    components: main
    architectures: amd64
    packages: [beekeeper-studio]
  - name: brave-browser-release
    key_url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    uris: https://brave-browser-apt-release.s3.brave.com
    suites: stable
    components: main
    architectures: amd64
    packages: [brave-browser]
  # Official ChatGPT desktop app with Codex. Its postinst manages chatgpt.sources
  # unless told not to, so use that name and switch the postinst off.
  - name: chatgpt
    key_url: https://persistent.oaistatic.com/codex-app-prod/linux/repository-signing-key.gpg
    uris: https://persistent.oaistatic.com/codex-app-prod/linux/deb
    suites: stable
    components: main
    architectures: amd64
    packages: [chatgpt]
    defaults_file: { path: /etc/default/chatgpt, content: 'repo_add_once="false"' }
  - name: claude-desktop
    key_url: https://downloads.claude.ai/claude-desktop/key.asc
    uris: https://downloads.claude.ai/claude-desktop/apt/stable
    suites: stable
    components: main
    architectures: amd64
    packages: [claude-desktop]
    defaults_file: { path: /etc/default/claude-desktop, content: 'CLAUDE_DESKTOP_ADD_REPO="false"' }
    replaces_files: [/etc/apt/sources.list.d/claude-desktop.list]
  - name: dbeaver-ce
    key_url: https://dbeaver.io/debs/dbeaver.gpg.key
    uris: https://dbeaver.io/debs/dbeaver-ce
    suites: /
    packages: [dbeaver-ce]
  - name: github-cli
    key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: amd64
    packages: [gh]
  # Same name as the file Chrome's own package manages, so both edit one file.
  - name: google-chrome
    key_url: https://dl.google.com/linux/linux_signing_key.pub
    uris: https://dl.google.com/linux/chrome/deb/
    suites: stable
    components: main
    architectures: amd64
    packages: [google-chrome-stable]
  # Use suite "prerelease" for Helium's pre-release builds.
  - name: helium
    key_url: https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc
    uris: https://pkg.helium.computer/deb
    suites: stable
    components: main
    architectures: amd64
    packages: [helium-bin]
  # Firefox as a real deb instead of Ubuntu's snap wrapper.
  - name: mozilla
    key_url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    uris: https://packages.mozilla.org/apt
    suites: mozilla
    components: main
    packages: [firefox]
    pin:
      origin: packages.mozilla.org
      priority: 1000
  - name: onlyoffice
    key_url: https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
    uris: https://download.onlyoffice.com/repo/debian
    suites: squeeze
    components: main
    architectures: amd64
    packages: [onlyoffice-desktopeditors]
  - name: vscode
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: amd64
    packages: [code]

# Answers to package install prompts, set before installing.
ubuntu_debconf:
  # The playbook manages the VS Code repo; stop the package adding a duplicate.
  - { name: code, question: code/add-microsoft-repo, value: "false", vtype: boolean }

# Standalone .deb downloads. Installed when missing, or when `version` differs
# from the installed one (omit `version` to install once and leave it).
ubuntu_debs:
  - name: balena-etcher
    version: "2.1.9"
    url: https://github.com/balena-io/etcher/releases/download/v2.1.9/balena-etcher_2.1.9_amd64.deb
    sha256: 7e0d0e0986e5d0f3d9c03a4c0004f9891235150e0da99fa0bc332d8c03f1a4c0
  - name: t3code
    version: "0.1.10~nightly.20261114.4695"
    url: https://github.com/pingdotgg/t3code/releases/download/v0.1.10-nightly.20261114.4695/T3-Code-0.1.10-nightly.20261114.4695-amd64.deb
    sha256: 458044322561c2e921675bdb6c708d81f74253a39170da6d7c90c3c52f05ef7f
  - name: aws-session-manager-plugin
    package: session-manager-plugin
    url: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb

