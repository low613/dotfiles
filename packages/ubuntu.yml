# Ubuntu 26.04 (Resolute Raccoon) packages. Mirrors packages/archlinux.yml;
# tools Ubuntu does not ship come from vendor apt repos, GitHub releases,
# Flathub, or (niri, xwayland-satellite) are built from source.

# Display manager package (shared/default-x-display-manager).
ubuntu_display_manager: gdm3

ubuntu_apt_packages:
  # Desktop session
  - dbus-user-session
  - fuzzel
  - ghostty
  - gnome-keyring
  - grim
  - hyprlock
  - hyprpolkitagent
  - kanshi
  - keyd
  - libsecret-tools
  - playerctl
  - seahorse
  - slurp
  - sway-notification-center
  - swaybg
  - swayidle
  - swayosd
  - udiskie
  - uwsm
  - waybar
  - wdisplays
  - wl-clipboard
  - wl-mirror
  - xdg-desktop-portal-gnome
  - xdg-desktop-portal-gtk
  - xdg-utils
  - xwayland
  # Audio, video, hardware
  - amd64-microcode
  - bluez
  - bolt
  - brightnessctl
  - btrfs-progs
  - efibootmgr
  - firmware-sof-signed
  - fprintd
  - fwupd
  - gstreamer1.0-pipewire
  - i965-va-driver
  - intel-media-va-driver
  - intel-microcode
  - iwd
  - libpam-fprintd
  - mesa-vulkan-drivers
  - pamixer
  - pipewire
  - pipewire-alsa
  - pipewire-jack
  - pipewire-pulse
  - power-profiles-daemon
  - pulseaudio-utils
  - smartmontools
  - systemd-zram-generator
  - vainfo
  - wireplumber
  - wpasupplicant
  # Fonts
  - fonts-firacode
  - fonts-font-awesome
  - fonts-noto-color-emoji
  # Shell and CLI
  - bat
  - bc
  - bind9-dnsutils
  - btop
  - build-essential
  - cpio
  - curl
  - fish
  - fzf
  - git
  - htop
  - imagemagick
  - jq
  - man-db
  - nano
  - neovim
  - openssh-client
  - pv
  - rsync
  - shellcheck
  - unzip
  - vim
  - wget
  - xz-utils
  - yq
  - zoxide
  # Development
  - awscli
  - caddy
  - composer
  - docker-buildx
  - docker-compose-v2
  - docker.io
  - golang-go
  - mariadb-server
  - nodejs
  - npm
  - pipx
  - postgresql
  - python3-boto3
  - python3-pip
  - python3-pytest
