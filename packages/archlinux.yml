# Arch Linux packages. Installed with pacman, AUR packages with yay.

# Third-party signed pacman repositories. Packages listed here are installed
# from them after the repo is trusted and added.
arch_pacman_repositories:
  # Official ChatGPT desktop app with Codex.
  - name: openai-chatgpt
    key_url: https://persistent.oaistatic.com/codex-app-prod/linux/repository-signing-key.gpg
    key_fingerprint: 3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4
    server: https://persistent.oaistatic.com/codex-app-prod/linux/arch/$arch
    packages: [chatgpt-bin]

